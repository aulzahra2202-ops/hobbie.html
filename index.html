<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hobbie</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 40px;
            color: #000000;
        }
        .box {
            border: 1px solid #555555;
            padding: 25px 40px 40px 40px;
            width: 320px;
            min-height: 400px;
        }
        h1, h2 {
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
        }
        h2 {
            font-size: 24px;
            margin-top: 30px;
        }
        p {
            font-size: 18px;
            margin-bottom: 15px;
        }
        ul {
            margin-top: 0;
            margin-bottom: 25px;
            padding-left: 20px;
        }
        ul li {
            font-size: 18px;
            margin-bottom: 3px;
        }
        ol {
            margin-top: 0;
            padding-left: 20px;
        }
        ol li {
            font-size: 18px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Hobi</h1>
        
        <p>Beberapa hobi saya seperti:</p>
        <ul>
            <li>Mendengarkan music</li>
            <li>menonton film</li>
            <li>bermain badminton</li>

        <h2>Hobi Favorit</h2>
        <ol type="A">
            <li>mendengarkan music</li>
 <li>menonton film</li>

        </ol>
    </div>

</body>
</html>
